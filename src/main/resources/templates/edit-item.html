<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Watchlist - Izmena statusa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a th:href="@{/}" class="logo">🎬 FilmWatchlist</a>
    <ul class="nav-links">
        <li><a th:href="@{/}">Početna</a></li>
        <li><a th:href="@{/search}">Pretraga</a></li>
        <li><a th:href="@{/watchlist}">Moja lista</a></li>
        <li><a th:href="@{/statistics}">Statistika</a></li>
    </ul>
</nav>

<div class="container">

    <a th:href="@{/watchlist}" class="btn btn-secondary btn-small">← Nazad na listu</a>

    <h1>Izmena statusa</h1>

    <div style="max-width: 500px; background-color: #1f1f1f; padding: 30px; border-radius: 8px; margin-top: 20px;">
        <h2 th:text="${item.film.title}">Naziv filma</h2>
        <p class="year" th:text="${item.film.year}">Godina</p>

        <form th:action="@{/watchlist/edit/{id}(id=${item.id})}" method="post" style="margin-top: 25px;">
            <div class="form-group">
                <label for="status">Odaberi novi status:</label>
                <select name="status" id="status">
                    <option th:each="s : ${statuses}"
                            th:value="${s}"
                            th:text="${s.displayName}"
                            th:selected="${s == item.status}">Status</option>
                </select>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button type="submit" class="btn">Sačuvaj izmene</button>
                <a th:href="@{/watchlist}" class="btn btn-secondary">Otkaži</a>
            </div>
        </form>
    </div>

</div>

<footer class="footer">
    <p>Film Watchlist &copy; 2026 | Spring Boot Projekat</p>
</footer>

</body>
</html>
